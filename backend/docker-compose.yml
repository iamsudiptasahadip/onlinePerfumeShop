version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: perfumology-db
    environment:
      POSTGRES_USER: perfumology
      POSTGRES_PASSWORD: perfumology123
      POSTGRES_DB: perfumology
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: